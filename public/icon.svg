<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Stockereum Runner Radar logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15171f"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <!-- Ethereum diamond gradient: top-half light silver, bottom-half Ethereum purple -->
    <linearGradient id="ethDiamond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a996ff"/>
      <stop offset="0.5" stop-color="#627EEA"/>
      <stop offset="1" stop-color="#3a4f9d"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#3a4f9d"/>
      <stop offset="1" stop-color="#8a92ff"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a996ff"/>
      <stop offset="1" stop-color="#627EEA"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded dark background -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="511" height="511" rx="112" ry="112" fill="none" stroke="#2a2d3a" stroke-width="1"/>

  <!-- Upward price bars (runner momentum) -->
  <g filter="url(#glow)">
    <rect x="104" y="288" width="56" height="120" rx="14" fill="url(#bar)" opacity="0.45"/>
    <rect x="184" y="232" width="56" height="176" rx="14" fill="url(#bar)" opacity="0.65"/>
    <rect x="264" y="168" width="56" height="240" rx="14" fill="url(#bar)" opacity="0.85"/>
    <rect x="344" y="112" width="56" height="296" rx="14" fill="url(#bar)"/>
  </g>

  <!-- Trend line — Ethereum purple gradient -->
  <polyline points="104,300 184,260 264,200 344,150 420,90"
            fill="none" stroke="url(#line)" stroke-width="16"
            stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Ethereum diamond up-arrow head at the trend line tip -->
  <polygon points="420,72 448,108 396,108" fill="#a996ff" filter="url(#glow)"/>

  <!-- Radar ring (early detection) -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#627EEA" stroke-width="4" opacity="0.35"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#3a4f9d" stroke-width="3" opacity="0.3" stroke-dasharray="6 10"/>
</svg>
