<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Offline — Stockereum Runner Radar</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(120% 100% at 50% 0%, #0b1220 0%, #000 100%);
      color: #e5e7eb;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .card {
      max-width: 28rem;
      padding: 2rem;
      border: 1px solid #1f2937;
      border-radius: 1rem;
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(8px);
    }
    h1 { color: #10b981; margin: 0 0 0.5rem; font-size: 1.25rem; }
    p  { margin: 0 0 1rem; color: #9ca3af; font-size: 0.95rem; line-height: 1.5; }
    a  { color: #22d3ee; text-decoration: none; font-weight: 600; }
    .logo {
      width: 4rem; height: 4rem; margin: 0 auto 1rem;
      background: url("/icon.svg") center/contain no-repeat;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo" role="img" aria-label="Runner Radar"></div>
    <h1>You're offline</h1>
    <p>The runner feed needs a live connection to Ave.ai. Reconnect and the dashboard will pick up right where you left off.</p>
    <a href="/?source=offline_retry">Retry</a>
  </div>
</body>
</html>
